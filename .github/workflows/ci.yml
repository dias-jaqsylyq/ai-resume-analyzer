name: ci

# PR: lint + tests, frontend typecheck/tests/build, terraform fmt/validate, terraform plan.
# Push to main: the same checks, then terraform apply for infra/, then the frontend deploy
# (static export -> S3 bucket behind CloudFront, config.json from Terraform outputs).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "1.13.4"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

defaults:
  run:
    shell: bash # explicit bash = -eo pipefail, so `| tee` does not hide failures

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dev tools
        run: pip install -r backend/requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        working-directory: backend
        run: pytest -q

  frontend:
    name: frontend (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build (static export)
        run: npm run build

      - name: Upload build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
          retention-days: 1

  terraform-check:
    name: terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform -chdir=infra fmt -check -recursive

      - name: terraform validate (main stack)
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

      - name: terraform validate (bootstrap)
        run: |
          terraform -chdir=infra/bootstrap init -backend=false
          terraform -chdir=infra/bootstrap validate

  plan:
    name: terraform plan (infra/)
    if: github.event_name == 'pull_request'
    needs: [backend, terraform-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for AWS, no stored keys
    concurrency:
      group: tf-plan-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Who am I
        run: aws sts get-caller-identity --query Arn --output text

      - name: terraform init
        run: terraform -chdir=infra init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform plan
        run: |
          terraform -chdir=infra plan -no-color -lock-timeout=5m -out=tfplan | tee plan.txt
          {
            echo "### terraform plan (infra/)"
            echo '```'
            grep -E -A3 '^(Plan:|No changes|Changes to Outputs)' plan.txt || tail -n 5 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: terraform apply (infra/)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, terraform-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for AWS, no stored keys
    # Never run two applies at once and never cancel one halfway.
    concurrency:
      group: tf-apply-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Who am I
        run: aws sts get-caller-identity --query Arn --output text

      - name: terraform init
        run: terraform -chdir=infra init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: terraform plan
        run: terraform -chdir=infra plan -no-color -lock-timeout=5m -out=tfplan

      - name: terraform apply
        run: |
          terraform -chdir=infra apply -no-color -lock-timeout=5m tfplan | tee apply.txt
          {
            echo "### terraform apply (infra/)"
            echo '```'
            grep -E '^Apply complete' apply.txt || tail -n 5 apply.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    name: deploy frontend (S3 + CloudFront)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [apply, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for AWS, no stored keys
    concurrency:
      group: deploy-frontend-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: frontend-out
          path: out

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read stack outputs
        run: |
          terraform -chdir=infra init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform -chdir=infra output -json > tf.json
          # Runtime config for the browser: public ids only (no secrets exist in a public client).
          jq '{apiUrl: .api_url.value, region: .aws_region.value,
               userPoolId: .cognito_user_pool_id.value, clientId: .cognito_client_id.value}' \
            tf.json > out/config.json
          {
            echo "WEB_BUCKET=$(jq -r .web_bucket.value tf.json)"
            echo "WEB_DISTRIBUTION_ID=$(jq -r .web_distribution_id.value tf.json)"
            echo "WEB_URL=$(jq -r .web_url.value tf.json)"
          } >> "$GITHUB_ENV"

      - name: Upload to S3
        run: |
          # Hashed assets first (immutable, old ones kept for open tabs), then pages + config.
          aws s3 sync out/_next "s3://$WEB_BUCKET/_next" \
            --cache-control "public,max-age=31536000,immutable" --only-show-errors
          aws s3 sync out "s3://$WEB_BUCKET" --exclude "_next/*" --delete \
            --cache-control "no-cache" --only-show-errors

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "$WEB_DISTRIBUTION_ID" \
            --paths "/*" --query Invalidation.Id --output text
          echo "### Dashboard deployed: $WEB_URL" >> "$GITHUB_STEP_SUMMARY"
